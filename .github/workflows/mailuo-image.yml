name: Build Mailuo deployment image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'pyodide-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'i18next-parser.config.ts'
      - 'postcss.config.js'
      - 'svelte.config.js'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.npmrc'
      - '.github/workflows/mailuo-image.yml'

concurrency:
  group: mailuo-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI Dockerfile
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:mailuo-${{ github.sha }}
          cache-from: type=gha,scope=mailuo-slim-linux-amd64
          cache-to: type=gha,scope=mailuo-slim-linux-amd64,mode=max
          build-args: |
            USE_SLIM=true
            BUILD_HASH=${{ github.sha }}

      - name: Verify published image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:mailuo-${GITHUB_SHA}"
